# Reference values for the worker service. Railway no longer reads this file (config as code is deprecated;
# seen 2026-11-27): set the same values on the service itself, see docs/ops/deploy.md, Railway service settings.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
startCommand = "sh ./scripts/railway-worker.sh"
