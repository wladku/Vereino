# Reference values for the backup service. Railway no longer reads this file (config as code is deprecated;
# seen 2026-11-27): set the same values on the service itself, see docs/ops/deploy.md, Railway service settings.
# Railway cron service of the nightly off-site backup (docs/ops/backups.md, issue #464). The service runs in the
# same Railway project as the database, so DATABASE_URL never leaves Railway; it starts at 02:30 UTC, runs
# backup-dump.mjs once and exits. A failed run is not retried here: the alert fires and the next night retries.
[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/backup/Dockerfile"

[deploy]
cronSchedule = "30 2 * * *"
restartPolicyType = "NEVER"
startCommand = "node scripts/backup-dump.mjs"
