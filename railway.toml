# Reference values for the app service. Railway no longer reads this file (config as code is deprecated;
# seen 2026-11-27): set the same values on the service itself, see docs/ops/deploy.md, Railway service settings.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# ADR-013, S14.5: migrations and the role-ACL sync run once per deploy, before the new release takes traffic. A failure
# fails the deploy and the previous release keeps serving. The start command never runs `yarn initialize`.
preDeployCommand = ["sh ./scripts/railway-predeploy.sh"]
healthcheckPath = "/api/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
startCommand = "sh ./scripts/railway-start.sh"
