# Required checks for main (engineering standards S14.1-S14.3): gate (build, lint, typecheck, unit tests with
# 100 % coverage), integration (aggregates the Playwright shards, each on an ephemeral app with Testcontainers
# PostgreSQL), browser-smoke (the same ephemeral app driven by agent-browser). pr-title runs on every PR but is
# advisory, and DCO is not required (ENG-AC-02, owner decision on #576). perf stays advisory until the first
# member page exists (S7.6). Third-party actions are pinned by commit SHA with the release tag in a comment (S14.2);
# Renovate updates them from phase E2.
# Docs-only PRs (#777, SDLC.md "Validation gate"): on `pull_request` events the `changes` job classifies the PR with
# `scripts/ci-changes.mjs`; when it changes documentation only, the integration shards, the browser-smoke work,
# image-smoke and perf are skipped, `integration` and `browser-smoke` still report success, and `gate` runs in full.
# `push` events (to `main` and `merge-train/**`) always run everything.
# Self-hosted runners (#834, `docs/ops/ci-runners.md`): gate, the integration shards, browser-smoke, image-smoke and
# perf run on the factory server's `vereino-ci` runners only when the repository variable `CI_SELF_HOSTED` is `true`
# and the event is trusted: a `push`, or a `pull_request` whose head branch is in this repository. Every other event
# (fork PRs above all) and every other job stays on `ubuntu-latest`; unsetting the variable sends every job back
# there. Each such job repeats the same `runs-on` expression; `yarn ci-runners:check` fails on any other runner value.
# The jobs never use a fixed host port and never need sudo on a self-hosted runner, where several jobs share one host.
name: CI

on:
  pull_request:
  push:
    # `merge-train/**`: the batch the merge train built with the Merges API (`.ai/specs/implemented/2026-11-18-batch-merge-train.md`);
    # the train judges only the checks of the batch head, and a newer batch cancels the older run (concurrency below).
    branches: [main, 'merge-train/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `code=true|false`: whether the PR changes anything but documentation. Pushes always give `true`. The PR merge
  # commit's first parent is the base branch tip, so `HEAD^1...HEAD` is exactly what the PR changes against it. A
  # failure here fails `integration` and `browser-smoke` (they never count a failed classification as docs-only).
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            node scripts/ci-changes.mjs HEAD^1 HEAD
          else
            echo "push event: the full suite runs"
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  gate:
    name: gate
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","vereino-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    # `yarn guard` reads the PR's labels (`guard-approved`) and the state of quarantine issues.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR merge commit and its first parent (the base branch tip): the diff `yarn guard` checks.
          fetch-depth: 2
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Install dependencies
        # The npm registry sometimes answers Yarn's hardened-mode metadata requests with 409; retry once.
        run: yarn install --immutable || (sleep 20 && yarn install --immutable)
      - run: yarn verify
      # Change guard (#520): weakened tests, new dependencies and secrets in the PR's diff block the gate unless the
      # PR carries the owner-only label `guard-approved`. The labels are read live, so after the owner adds the label
      # a rerun of this job passes. A push to `main` compares HEAD with itself and passes.
      - name: Guard
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            yarn guard --base HEAD^1 --pr "$PR_NUMBER"
          else
            yarn guard --base HEAD
          fi

  # The whole suite took 43-46 min in one job by 2026-11-06 (#193, #196), so it runs as Playwright shards. Each
  # shard has its own Testcontainers database and production build; the `integration` job below aggregates them
  # under the check name the main ruleset requires. Add a shard number when a shard nears its timeout.
  # Six shards since 2026-11-18: three shards took 30-35 min each (41 min per CI run on average), and the merge
  # train merges one PR per CI run, so the shard time bounds how many PRs reach main per hour.
  integration-shard:
    name: integration (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","vereino-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Install dependencies
        # The npm registry sometimes answers Yarn's hardened-mode metadata requests with 409; retry once.
        run: yarn install --immutable || (sleep 20 && yarn install --immutable)
      - name: Install Playwright browser
        working-directory: packages/app
        # A self-hosted runner has no sudo: its system libraries come from `scripts/ci-runner-setup.sh`.
        env:
          WITH_DEPS: ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }}
        run: npx playwright install $WITH_DEPS chromium
      # Vereino runner: Testcontainers PostgreSQL 17 (pgvector), yarn initialize, production build, Playwright.
      - run: yarn test:integration:vereino --shard ${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: packages/app/.ai/qa/test-results/
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: integration
    needs: [changes, integration-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed, or a docs-only PR skipped them
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          SHARDS_RESULT: ${{ needs.integration-shard.result }}
        run: |
          echo "changes: $CHANGES_RESULT (code=$CODE); integration shards: $SHARDS_RESULT"
          if [ "$CHANGES_RESULT" = success ] && [ "$CODE" = false ] && [ "$SHARDS_RESULT" = skipped ]; then
            echo "Docs-only PR: the shards were skipped (#777)"
            exit 0
          fi
          test "$SHARDS_RESULT" = success

  # On a docs-only PR the job still runs and reports success, but every step after the first is skipped (#777). It runs
  # when `changes` failed too, and then fails, so a broken classification never reads as a skipped, passing check.
  browser-smoke:
    name: browser-smoke
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","vereino-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      CODE: ${{ needs.changes.outputs.code }}
      # agent-browser native release, pinned and verified by checksum (S16.1, S14.2).
      AGENT_BROWSER_VERSION: v0.38.2
      AGENT_BROWSER_SHA256: a54b765192db774666f0513fa8b545a298753b6f29e73bcdf4a1e78f18e7c0e1
    steps:
      - name: Code changed, or a docs-only PR
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          echo "changes: $CHANGES_RESULT (code=$CODE)"
          test "$CHANGES_RESULT" = success
          if [ "$CODE" = false ]; then echo "Docs-only PR: the browser smoke is skipped (#777)"; fi
      - if: ${{ env.CODE == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: ${{ env.CODE == 'true' }}
        run: corepack enable
      - if: ${{ env.CODE == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Install dependencies
        if: ${{ env.CODE == 'true' }}
        # The npm registry sometimes answers Yarn's hardened-mode metadata requests with 409; retry once.
        run: yarn install --immutable || (sleep 20 && yarn install --immutable)
      - name: Install agent-browser
        if: ${{ env.CODE == 'true' }}
        run: |
          BIN="$RUNNER_TEMP/agent-browser"
          curl -fsSL --retry 3 -o "$BIN" \
            "https://github.com/vercel-labs/agent-browser/releases/download/$AGENT_BROWSER_VERSION/agent-browser-linux-x64"
          echo "$AGENT_BROWSER_SHA256  $BIN" | sha256sum --check
          chmod 755 "$BIN"
          "$BIN" install
          "$BIN" doctor --json > /dev/null || sudo -n "$BIN" install --with-deps
          "$BIN" doctor --json > /dev/null
          echo "AGENT_BROWSER_BIN=$BIN" >> "$GITHUB_ENV"
      - name: Start the ephemeral app (Testcontainers PostgreSQL)
        if: ${{ env.CODE == 'true' }}
        # A free port, not 5001: on a self-hosted runner other jobs of the same host may hold it.
        run: |
          PORT="$(node --input-type=module -e "const m = await import('./packages/app/scripts/vereino-ephemeral.mjs'); console.log(await m.findFreePort())")"
          echo "APP_BASE_URL=http://127.0.0.1:$PORT" >> "$GITHUB_ENV"
          nohup yarn test:integration:vereino:start --port "$PORT" > ephemeral-app.log 2>&1 &
          for attempt in $(seq 1 120); do
            if curl --silent --fail --output /dev/null "http://127.0.0.1:$PORT/login"; then exit 0; fi
            sleep 10
          done
          tail -n 100 ephemeral-app.log
          exit 1
      - name: Sign in through agent-browser
        if: ${{ env.CODE == 'true' }}
        working-directory: packages/app
        run: BASE_URL="$APP_BASE_URL" node .ai/qa/agent-browser/login-smoke.mjs
      - name: Upload screenshots and app log
        if: ${{ !cancelled() && env.CODE == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-smoke
          path: |
            packages/app/.ai/qa/test-results/agent-browser/
            ephemeral-app.log
          if-no-files-found: ignore
          retention-days: 14

  # The deployed image (#727): builds the Dockerfile's `runner` stage and runs it as Railway does — pre-deploy on an
  # empty database, `yarn initialize`, the app with the Redis cache, the worker — then `scripts/smoke.mjs` against it.
  # The integration suite runs a workspace build, not this image, so only this job sees a broken runner stage.
  image-smoke:
    name: image-smoke
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","vereino-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: scripts/image-smoke.sh

  # The Enterprise overlay shape (enterprise package spec DD-E11, ENT-TEST-03..05; #713): the public fixture package
  # `@vereino/enterprise` (`packages/app/.ai/qa/fixtures/enterprise-overlay/`) is overlaid the way the cloud build
  # overlays the private one, without any secret. Every other job runs the public shape. The overlay script fails when
  # the install changes a third-party resolution in `yarn.lock`; `--ci` trusts the committed TEST licence key pair,
  # which the app accepts only with `VEREINO_CI=true` (set by ENT-TEST-03 for the server it starts).
  enterprise-overlay:
    name: enterprise-overlay
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_VEREINO_ENTERPRISE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Install dependencies (public lockfile)
        # The npm registry sometimes answers Yarn's hardened-mode metadata requests with 409; retry once.
        run: yarn install --immutable || (sleep 20 && yarn install --immutable)
      - name: Overlay the fixture Enterprise package
        run: |
          cp -R packages/app/.ai/qa/fixtures/enterprise-overlay packages/enterprise
          node scripts/enterprise-overlay.mjs --ci
      - run: yarn generate
      - run: yarn typecheck
      - run: yarn licenses:check
      - run: yarn forbidden-packages:check --overlay
      - name: Module checks on the Enterprise package (as the private CI runs them)
        run: |
          yarn contracts:check --modules-root ../enterprise/src/modules
          yarn route-isolation:check --modules-root ../enterprise/src/modules
          yarn i18n:check-hardcoded --strict --modules-root ../enterprise/src/modules
      - name: Install Playwright browser
        working-directory: packages/app
        run: npx playwright install --with-deps chromium
      # The production build of the overlay shape, then ENT-TEST-03 (skipped by every public run).
      - run: yarn test:integration:vereino --filter ENT-TEST-03
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-enterprise-overlay
          path: packages/app/.ai/qa/test-results/
          if-no-files-found: ignore
          retention-days: 14

  perf:
    name: perf
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ${{ vars.CI_SELF_HOSTED == 'true' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","vereino-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Install dependencies
        # The npm registry sometimes answers Yarn's hardened-mode metadata requests with 409; retry once.
        run: yarn install --immutable || (sleep 20 && yarn install --immutable)
      - name: Start the ephemeral app
        # A free port, not 5001: on a self-hosted runner other jobs of the same host may hold it.
        run: |
          PORT="$(node --input-type=module -e "const m = await import('./packages/app/scripts/vereino-ephemeral.mjs'); console.log(await m.findFreePort())")"
          echo "APP_BASE_URL=http://127.0.0.1:$PORT" >> "$GITHUB_ENV"
          nohup yarn test:integration:vereino:start --port "$PORT" > ephemeral-app.log 2>&1 &
          for attempt in $(seq 1 120); do
            if curl --silent --fail --output /dev/null "http://127.0.0.1:$PORT/login"; then exit 0; fi
            sleep 10
          done
          tail -n 100 ephemeral-app.log
          exit 1
      # A self-hosted runner has no Google Chrome (the hosted image has): Lighthouse uses Playwright's Chromium.
      - name: Chromium for Lighthouse (factory runner)
        if: ${{ runner.environment != 'github-hosted' }}
        working-directory: packages/app
        run: |
          npx playwright install chromium
          echo "CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Lighthouse (mobile, advisory baseline)
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          urls: ${{ env.APP_BASE_URL }}/login
          runs: 3
          uploadArtifacts: true
          temporaryPublicStorage: false

  pr-title:
    name: pr-title
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            ci
            build
            perf
            revert

  dependency-review:
    name: dependency-review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
