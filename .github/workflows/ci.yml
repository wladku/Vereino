# Required checks for main (engineering standards S14.1-S14.3): gate (build, lint, typecheck, unit tests with
# 100 % coverage), integration (Playwright on an ephemeral app with Testcontainers PostgreSQL),
# browser-smoke (the same ephemeral app driven by agent-browser), pr-title, DCO (app).
# perf stays advisory until the first member page exists (S7.6). Third-party actions are pinned by
# commit SHA with the release tag in a comment (S14.2); Renovate updates them from phase E2.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Install dependencies
        # The npm registry sometimes answers Yarn's hardened-mode metadata requests with 409; retry once.
        run: yarn install --immutable || (sleep 20 && yarn install --immutable)
      - run: yarn verify

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Install dependencies
        # The npm registry sometimes answers Yarn's hardened-mode metadata requests with 409; retry once.
        run: yarn install --immutable || (sleep 20 && yarn install --immutable)
      - name: Install Playwright browser
        working-directory: packages/app
        run: npx playwright install --with-deps chromium
      # Vereino runner: Testcontainers PostgreSQL 17 (pgvector), yarn initialize, production build, Playwright.
      - run: yarn test:integration:vereino
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: packages/app/.ai/qa/test-results/
          if-no-files-found: ignore
          retention-days: 14

  browser-smoke:
    name: browser-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # agent-browser native release, pinned and verified by checksum (S16.1, S14.2).
      AGENT_BROWSER_VERSION: v0.38.2
      AGENT_BROWSER_SHA256: a54b765192db774666f0513fa8b545a298753b6f29e73bcdf4a1e78f18e7c0e1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Install dependencies
        # The npm registry sometimes answers Yarn's hardened-mode metadata requests with 409; retry once.
        run: yarn install --immutable || (sleep 20 && yarn install --immutable)
      - name: Install agent-browser
        run: |
          BIN="$RUNNER_TEMP/agent-browser"
          curl -fsSL --retry 3 -o "$BIN" \
            "https://github.com/vercel-labs/agent-browser/releases/download/$AGENT_BROWSER_VERSION/agent-browser-linux-x64"
          echo "$AGENT_BROWSER_SHA256  $BIN" | sha256sum --check
          chmod 755 "$BIN"
          "$BIN" install
          "$BIN" doctor --json > /dev/null || sudo -n "$BIN" install --with-deps
          "$BIN" doctor --json > /dev/null
          echo "AGENT_BROWSER_BIN=$BIN" >> "$GITHUB_ENV"
      - name: Start the ephemeral app (Testcontainers PostgreSQL)
        run: |
          nohup yarn test:integration:vereino:start > ephemeral-app.log 2>&1 &
          for attempt in $(seq 1 120); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:5001/login; then exit 0; fi
            sleep 10
          done
          tail -n 100 ephemeral-app.log
          exit 1
      - name: Sign in through agent-browser
        working-directory: packages/app
        env:
          BASE_URL: http://127.0.0.1:5001
        run: node .ai/qa/agent-browser/login-smoke.mjs
      - name: Upload screenshots and app log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-smoke
          path: |
            packages/app/.ai/qa/test-results/agent-browser/
            ephemeral-app.log
          if-no-files-found: ignore
          retention-days: 14

  perf:
    name: perf
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Install dependencies
        # The npm registry sometimes answers Yarn's hardened-mode metadata requests with 409; retry once.
        run: yarn install --immutable || (sleep 20 && yarn install --immutable)
      - name: Start the ephemeral app
        run: |
          nohup yarn test:integration:vereino:start > ephemeral-app.log 2>&1 &
          for attempt in $(seq 1 120); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:5001/login; then exit 0; fi
            sleep 10
          done
          tail -n 100 ephemeral-app.log
          exit 1
      - name: Lighthouse (mobile, advisory baseline)
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          urls: http://127.0.0.1:5001/login
          runs: 3
          uploadArtifacts: true
          temporaryPublicStorage: false

  pr-title:
    name: pr-title
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            ci
            build
            perf
            revert

  dependency-review:
    name: dependency-review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
