# The merge train (SDLC.md "Validation gate"): one PR at a time takes `main` in, runs CI and merges when the required
# checks are green, around the clock. It needs the `MERGE_TRAIN_TOKEN` secret, a fine-grained token of the owner with
# Contents, Pull requests, Issues and Workflows write on this repository: an update or a merge made with the workflow's
# own GITHUB_TOKEN would not start the CI it waits for. Issues write mirrors the train's labels onto the issue named in
# the PR's branch (`issue-N`); without it that step logs a warning. Without the secret the job only logs a notice.
# It runs `main`'s copy of the scripts and never checks out PR code. With MERGE_TRAIN_BATCH_SIZE 2 or more it is the batch
# train (`.ai/specs/2026-11-18-batch-merge-train.md`): it builds `merge-train/batch` server-side, which then also needs
# Commit statuses write (`merge-train/verified`, `merge-train/verdict`) and Issues write (the pause issue). Once the `main`
# ruleset requires `merge-train/verified`, the one-PR train sets it too before each merge, so Commit statuses write is
# needed in both modes (switch-on order: `docs/ops/batch-train-switch-on.md`).
name: Merge train

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  push:
    branches: [main]
  pull_request_target:
    types: [labeled, unlabeled, ready_for_review]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log the plan without changing anything
        type: boolean
        default: false
      batch_size:
        description: Batch size a dry run plans with (empty = the MERGE_TRAIN_BATCH_SIZE variable, unset = 1); ignored without dry run
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: merge-train
  cancel-in-progress: false

jobs:
  train:
    name: merge-train
    if: github.repository == 'wladku/Vereino'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts
            .nvmrc
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/merge-train.mjs
        env:
          GH_TOKEN: ${{ secrets.MERGE_TRAIN_TOKEN }}
          MERGE_TRAIN_SKIP_LABELS: ${{ vars.MERGE_TRAIN_SKIP_LABELS }}
          MERGE_TRAIN_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          # Only a dry run takes the input: a real run with size 2 or more is the batch train, which the owner switches
          # on with the variable (spec phase 3).
          MERGE_TRAIN_BATCH_SIZE: ${{ (inputs.dry_run && inputs.batch_size) || vars.MERGE_TRAIN_BATCH_SIZE }}
          MERGE_TRAIN_REQUIRED_CHECKS: ${{ vars.MERGE_TRAIN_REQUIRED_CHECKS }}
