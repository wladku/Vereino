# The CI failure ledger (merge-throughput spec, REQ-MT04; SDLC.md "Validation gate"): after a failed CI run of this
# repository, it records the failed integration tests in the ledger issue and opens a quarantine issue (labels bug,
# priority-high, cezar) for a test that fails in two runs sharing no PR within 48 h, or on main. It never blocks a
# merge. It runs main's copy of the script, never checks out PR code, skips runs from forks, and writes only test ids
# and spec paths that exist on main, because the quarantine issue starts an autonomous build.
name: CI failure ledger

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: CI run id to read
        required: true
      dry_run:
        description: Log the plan without writing issues
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-failure-ledger
  cancel-in-progress: false

jobs:
  ledger:
    name: ci-failure-ledger
    if: >-
      github.repository == 'wladku/Vereino' &&
      (github.event_name == 'workflow_dispatch' ||
       (contains(fromJSON('["failure","cancelled","timed_out"]'), github.event.workflow_run.conclusion) &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts
            packages/app/.ai/qa/tests
            .nvmrc
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Download the run's Playwright reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: playwright-report-shard-*
          path: ${{ runner.temp }}/reports
      - run: node scripts/ci-failure-ledger.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          LEDGER_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
          LEDGER_REPORTS_DIR: ${{ runner.temp }}/reports
          LEDGER_TESTS_DIR: packages/app/.ai/qa/tests
          LEDGER_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
